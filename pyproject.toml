[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rankbound"
version = "1.0.0"
description = "Upper bounds on the rank of elliptic curves over Q under GRH for the unramified quadratic extensions of a cubic field (no BSD), with independently checkable certificates"
readme = "README.md"
license = {text = "GPL-2.0-or-later"}
authors = [{name = "Ritik Jain"}]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Repository = "https://github.com/rjain2470/rankbound"

[project.scripts]
rankbound = "rankbound.__main__:main"

[tool.setuptools]
packages = ["rankbound", "rankbound.verify"]

[tool.setuptools.package-data]
"rankbound" = ["field.gp", "f2elim.c", "f2elim"]
"rankbound.verify" = ["verify.gp", "f2rank.c", "f2rank"]
